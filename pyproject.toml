[project]
name = "efficient-vlm-ad"
version = "0.1.0"
description = "DINOv2-S and T5-Efficient-Mini MVPruner finetuning pipeline for Kaggle."
requires-python = ">=3.10"
dependencies = [
  "datasets",
  "huggingface_hub",
  "numpy",
  "pillow",
  "pyyaml",
  "timm",
  "torch",
  "torchvision",
  "tqdm",
  "transformers",
  "accelerate",
]

[project.optional-dependencies]
dev = ["pytest"]
mvpruner = ["transformers==4.46.3", "tokenizers==0.20.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
