[project]
name = "efficient-vlm-ad"
version = "0.1.0"
description = "Refactored EM-VLM4AD pipeline for Kaggle, RepViT, and T5-Efficient experiments."
requires-python = ">=3.10"
dependencies = [
  "datasets",
  "huggingface_hub",
  "numpy",
  "pillow",
  "pyyaml",
  "timm",
  "torch",
  "torchvision",
  "tqdm",
  "transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
